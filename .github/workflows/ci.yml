name: CI

# Which jobs run is decided by the "changes" job (see .github/scripts/changes.sh
# and CONTRIBUTING.md): the extension job for
# extension or shared changes, nothing for docs-only changes. Jobs are skipped
# with job-level conditions, never workflow-level path filters, so the
# "ci-ok" check always reports and can be required.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.detect.outputs.extension }}
      javascript: ${{ steps.detect.outputs.javascript }}
      codeql: ${{ steps.detect.outputs.codeql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the diff against the base or previous tip works.
          fetch-depth: 0
          persist-credentials: false
      - name: Test the path classifier
        run: |
          shellcheck .github/scripts/*.sh
          sh .github/scripts/changes_test.sh
      - name: Decide what to run
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh .github/scripts/detect.sh

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Extension tests
        run: make extension-test
      - name: Extension rules are in sync with src/classify/rules.json
        run: make extension-check
      - name: Shared UI helpers are in sync with shared/ui-common.js
        run: make ui-check
      - name: Build the zip twice and require identical bytes
        run: |
          set -euo pipefail
          make extension-zip
          first="$(sha256sum dist/history-timeline-extension_v*.zip)"
          make extension-zip
          second="$(sha256sum dist/history-timeline-extension_v*.zip)"
          [ "$first" = "$second" ] || { echo "::error::zip build is not reproducible"; exit 1; }
          cd dist && sha256sum -- history-timeline-extension_v*.zip | tee SHA256SUMS-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: |
            dist/history-timeline-extension_v*.zip
            dist/SHA256SUMS-extension
          if-no-files-found: error

  # Playwright browser checks (full Chromium, synthetic data only).
  # ADVISORY: continue-on-error is set and this job is deliberately NOT in the
  # ci-ok needs list, so a failure cannot block merges. Promote it only after
  # 10 consecutive green runs on main (see CONTRIBUTING.md, "Promoting the
  # browser checks").
  extension-browser:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies from the lockfile
        working-directory: extension
        run: npm ci
      - name: Read the pinned Playwright version
        id: pw
        working-directory: extension
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium download
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: extension
        run: npx playwright-core install --with-deps chromium
      - name: Install system libraries only (browser restored from cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: extension
        run: npx playwright-core install-deps chromium
      - name: Browser checks (chrome-check, ui-check, zip-check)
        run: make browser-check

  # Compares the master fixture/rules with the downstream copies in
  # Jubblin/history-timeline-app (public, anonymous HTTPS, branch main).
  # ADVISORY: continue-on-error is set and this job is deliberately NOT in the
  # ci-ok needs list, so network flakiness or a not-yet-synced app repo cannot
  # block merges. A fetch failure exits 2 and shows as a failed (not green) step.
  drift:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Fixture and rules match the app repo copies
        run: make drift-check

  # One stable check name to require in branch protection. Skipped jobs pass;
  # failed or cancelled ones fail it.
  ci-ok:
    if: always()
    needs: [changes, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "::error::a required job finished as '$r'"; exit 1 ;;
            esac
          done
