name: Security

# Which jobs run is decided by the "changes" job (see .github/scripts/changes.sh
# and CONTRIBUTING.md): CodeQL for JavaScript changes, nothing for docs-only changes. Jobs are skipped
# with job-level conditions, never workflow-level path filters, so the
# "security-ok" check always reports and can be required.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.detect.outputs.extension }}
      javascript: ${{ steps.detect.outputs.javascript }}
      codeql: ${{ steps.detect.outputs.codeql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the diff against the base or previous tip works.
          fetch-depth: 0
          persist-credentials: false
      - name: Test the path classifier
        run: |
          shellcheck .github/scripts/*.sh
          sh .github/scripts/changes_test.sh
      - name: Decide what to run
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh .github/scripts/detect.sh

  codeql:
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"

  security-ok:
    if: always()
    needs: [changes, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "::error::a required job finished as '$r'"; exit 1 ;;
            esac
          done
