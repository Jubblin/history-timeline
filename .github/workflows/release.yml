name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test and build the extension zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          make extension-test
          # Fails unless the tag (without "v") equals the manifest version.
          make extension-zip TAG="$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-extension
          path: dist/history-timeline-extension_v*.zip
          if-no-files-found: error

  publish:
    needs: [extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # List rather than view: older gh versions cannot find drafts by tag.
          # The tag is read via env.TAG inside jq, never spliced into the program.
          state=$(gh release list --limit 1000 --json tagName,isDraft \
            --jq '[.[] | select(.tagName == env.TAG)] | if length == 0 then "" elif any(.[]; .isDraft | not) then "published" else "draft" end')
          case "$state" in
            "")
              gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "$TAG"
              ;;
            draft)
              echo "Draft release for $TAG already exists; replacing its assets."
              gh release upload "$TAG" dist/* --clobber
              ;;
            *)
              echo "::error::Release $TAG is already published; refusing to modify it. Delete the release and re-run, or use a new tag."
              exit 1
              ;;
          esac
